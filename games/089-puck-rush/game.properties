game.summary=Fast table air hockey against a CPU opponent: slide your mallet, bank off the rails and score first to seven.
game.description=An arcade air-hockey table squeezed onto a phone screen. Drive your mallet around your half with the joystick or the 1/3/7/9 diagonals; a mallet in motion transfers its speed to the puck, so swing through your shots. The CPU chases loose pucks in its half and falls back to guard its goal. Casual and Pro modes change how fast the CPU reacts.
game.objective=Score seven goals before the CPU does.
game.controls=2/4/6/8:Move mallet|1/3/7/9:Move diagonally|*:Pause menu
game.modes=Casual|Pro
