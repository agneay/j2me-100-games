game.summary=A graphical text adventure: explore a ruined keep, solve item puzzles and restore the tower's gem - no typing needed.
game.description=A classic illustrated adventure redesigned for a keypad. Every room is drawn on screen, and instead of typing commands you pick from a menu that only lists what makes sense right now: look, go somewhere, take what you see, or use what you carry. Ten rooms, seven items and a chain of puzzles involving a hungry hound, a locked library, a dark cellar and a ghostly knight. Fewer moves earns a better score.
game.objective=Find the stolen gem and return it to the statue at the top of the tower.
game.controls=2/8:Choose an action|5:Perform the action|*:Pause menu
