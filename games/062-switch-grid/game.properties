game.summary=Every switch flips its neighbours too - turn all the lights off. On the 3x3 board, the keypad is the grid.
game.description=A light-switching logic puzzle in three flavours. Keypad 3x3 maps keys 1-9 straight onto the switches, Classic 5x5 uses a cursor, and Wrap 5x5 lets neighbours wrap around the edges. Each puzzle is built by pressing random switches, so it is always solvable; finish within par for a bonus. Twenty increasingly scrambled levels.
game.objective=Turn every light off, ideally within the par number of presses.
game.controls=1-9:Press that switch (3x3)|2/4/6/8:Move cursor (5x5)|5:Press switch (5x5)|*:Pause menu
game.modes=Keypad 3x3|Classic 5x5|Wrap 5x5
