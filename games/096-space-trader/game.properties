game.summary=Buy low and sell high across six worlds in thirty days, dodging pirates and chasing price spikes to pay off your loan.
game.description=A compact space trading sim. Every planet produces some goods cheaply and pays a premium for others, prices drift each day, and news of shortages and gluts can double or halve a market. Fill your hold, plot a course on the star map, and watch your fuel: longer hops cost more days and more fuel, and fuel is cheaper on the outer moons. Pirates may raid your cargo on arrival. Expand your hold when you can afford it, and finish day thirty with as much money as possible after repaying the loan.
game.objective=End day 30 with the highest net worth after repaying your loan.
game.controls=2/8:Choose good|6:Buy one|4:Sell one|3:Buy max|1:Sell all|5:Star map / travel|0:Buy fuel (map: back)|9:Upgrade hold|*:Pause menu
