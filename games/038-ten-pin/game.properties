game.description=Choose your release point, stop the swinging aim arrow and time the power meter, then watch the ball crash into the rack. Pins are simulated as circles that pass momentum to each other, so a ball into the pocket really does scatter the deck. Full ten-frame scoring with strike and spare bonuses and a three-ball tenth frame; a perfect game is 300.
game.objective=Score as many points as possible over ten frames (maximum 300).
