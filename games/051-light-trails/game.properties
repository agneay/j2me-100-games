game.summary=Light-cycle duels: leave walls of light behind you and be the last rider standing.
game.description=Arena survival against one or three AI riders. Every bike paints a permanent wall as it moves; the AI chooses turns by measuring how much open space each direction leaves it, so it fights for territory rather than driving randomly. Turns are buffered so quick taps register, and a rechargeable boost lets you cut opponents off. First to three round wins takes the match.
game.objective=Win three rounds by being the last light cycle still riding.
game.controls=2/4/6/8:Turn|5 (hold):Boost|*:Pause menu
game.modes=1 rival|3 rivals
