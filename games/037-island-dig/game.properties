game.summary=Comb a random island with a metal detector and three compass readings to dig up three buried chests.
game.description=A turn-based treasure hunt on a freshly generated island. Each step drains energy and updates your metal detector, which beeps louder as you close in on an unfound chest. Three compass readings point the way when you are lost. Digging turns up coins, coconuts and junk as well as treasure, while wandering crabs pinch anyone who gets in their way.
game.objective=Dig up all three treasure chests before your energy runs out.
game.controls=2/4/6/8:Walk|5:Dig|#:Use compass (3 per game)|*:Pause menu
game.modes=Normal|Hard (less energy)
game.tags=treasure hunt,exploration,turn-based,deduction
