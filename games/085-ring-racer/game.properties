game.summary=Fly a behind-the-ship space race through a course of rings - every ring adds time to the clock.
game.description=A pseudo-3D flying racer drawn with integer perspective: rings and mines rush towards you out of a starfield and you steer so each ring passes around your ship. Rings add two seconds and build a streak multiplier, mines knock five seconds off, boost trades control for speed, and the course spreads out and speeds up the further you get.
game.objective=Fly through as many rings as possible before the clock runs out.
game.controls=2/4/6/8:Steer|5 (hold):Boost|*:Pause menu
game.tags=racing,space,pseudo 3d,time attack
