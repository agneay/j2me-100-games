game.description=A bite-sized farming sim driven by one context key: 5 tills, plants, waters or harvests depending on the plot. Four crops with different growth times and prices, daily market swings, an energy budget that forces you to sleep, rain forecasts that save you a watering run, and crops that wither if left dry for three days. Play the 28-day Season challenge or farm forever in Endless mode.
