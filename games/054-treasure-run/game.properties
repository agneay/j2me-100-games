game.summary=An endless temple runner: jump pits and crates, slide under beams and scoop up gems as the pace builds.
game.description=Your explorer sprints automatically; you decide when to jump, double-jump and slide. Pits, crates and low stone beams come thicker and faster the further you get, gems arc over the obstacles to tempt risky jumps, and a rare shield orb absorbs one hit. Score is distance plus ten per gem.
game.objective=Run as far as you can without falling or crashing.
game.controls=2/5:Jump (again in the air to double jump)|8:Slide|*:Pause menu
