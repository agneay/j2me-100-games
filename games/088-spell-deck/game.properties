game.summary=A pocket deck-building duel: draw four spells, spend three mana, read the foe's intent and grow your deck after each win.
game.description=Fight through five foes with a ten-card starter deck. Every turn you draw four spell cards and have three mana to spend on strikes, fireballs, wards, heals, life drains and freezing frost. Each enemy telegraphs its next move, so you know when to block and when to go all in. Beat a foe and pick one of three new cards to add to your deck before the next battle.
game.objective=Defeat all five foes, ending with the Lich King.
game.controls=4/6:Choose card|5:Cast card|#/0:End turn|*:Pause menu
