game.summary=Drive a little 4x4 over endless rolling hills - feather the gas, tilt in the air and land on your wheels.
game.description=A side-view physics driver over procedurally generated hills that grow steeper the further you go. Gravity pulls you back on climbs and launches you off crests; in the air, 4 and 6 tilt the car so you can land on your wheels (clean landings earn a bonus, landing on your roof ends the run). Fuel cans keep the tank topped up and coins add to your score.
game.objective=Drive as far as possible before you flip over or run out of fuel.
game.controls=6/2:Gas|4/8:Brake / reverse|4/6 (in the air):Tilt the car|*:Pause menu
game.tags=racing,physics,driving,endless
game.featured=true
