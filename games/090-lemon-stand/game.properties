game.summary=Run a lemonade stand for fourteen days: read the forecast, tune your recipe, price and batch size, and build a reputation.
game.description=A bite-sized business sim. Every morning brings a weather forecast; you choose how sweet to make the lemonade, what to charge and how many cups to prepare before opening. Hot days and heatwaves bring crowds, rain keeps them home, and the forecast is not always right. Balanced lemonade at a fair price grows your reputation and your future customer count, while unsold cups are poured away at the end of the day.
game.objective=Finish the fourteenth day with as much cash as possible.
game.controls=2/8:Choose setting|4/6:Change value|5:Open stand / next day|*:Pause menu
