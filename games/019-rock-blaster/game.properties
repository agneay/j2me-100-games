game.summary=Pilot a drifting vector ship through wrap-around space, splitting tumbling rocks and dodging a sharpshooting saucer.
game.description=Inertia-based space shooting drawn entirely with lines. Rotate with 4/6, thrust with 2 and fire with 5 while rocks split from large to medium to small. A saucer cruises through and aims at you, hyperspace is an emergency escape that might land you somewhere worse, and every 10000 points earns an extra ship. All physics use fixed-point integer maths for old handsets.
game.objective=Clear wave after wave of rocks and survive as long as possible.
game.controls=4/6:Rotate|2:Thrust|5:Fire|8/0:Hyperspace|*:Pause menu
