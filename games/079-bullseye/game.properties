game.summary=Target archery: steer a swaying sight, hold your breath to steady it and allow for the wind.
game.description=Twelve arrows across three distances - 30, 50 and 70 metres. The sight drifts with your breathing and sways more at long range; hold 0 to steady it, but your breath runs out and the sway gets worse while you recover. A wind flag shows how far each arrow will drift, so aim off into the wind. Ten-ring scoring with every arrow hole left in the target face.
game.objective=Score as many points as possible with twelve arrows (maximum 120).
game.controls=2/4/6/8:Aim|5:Shoot|0 (hold):Hold breath to steady the aim|*:Pause menu
