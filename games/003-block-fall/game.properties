game.summary=Rotate and drop falling four-block pieces to clear rows, in endless Marathon or a 40-line Sprint.
game.description=A falling-blocks puzzle tuned for a phone keypad: delayed auto-shift on 4 and 6, rotation in both directions, a ghost piece showing where the block lands, hard drop on 0 or #, and a fair shuffled bag so you never wait forever for a long piece. Marathon speeds up every ten lines; Sprint 40 is a race against the clock.
game.objective=Clear rows by filling them completely. Marathon: survive and score. Sprint 40: clear 40 lines in the shortest time.
game.controls=4/6:Move left / right|8:Soft drop|2/5:Rotate clockwise|1:Rotate anticlockwise|0/#:Hard drop|*:Pause menu
game.modes=Marathon|Sprint 40
game.tags=falling blocks,puzzle,score attack,time trial
game.featured=true
