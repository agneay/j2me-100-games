game.summary=The keypad is a signal box: flip seven sets of points with keys 1-7 to route coloured trains to matching stations.
game.description=An experiment in using the number pad as a control panel. A branching railway fans out from a single line into eight coloured stations, with seven sets of points along the way, and each point is mapped to one number key. Trains roll in from the left one after another; flip the points ahead of them so every train ends up at a station of its own colour. Trains speed up and arrive closer together as you deliver more, and three wrong deliveries end your shift.
game.objective=Deliver as many trains as possible before making three mistakes.
game.controls=1-7:Flip a set of points|*:Pause menu
game.modes=Branch line|Main line
game.tags=trains,routing,reflex,keypad
