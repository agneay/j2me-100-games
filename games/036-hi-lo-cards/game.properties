game.summary=Guess higher or lower to climb a seven-card ladder, doubling the prize each rung - bank it or risk it all.
game.description=A push-your-luck card game in ten rounds. Each correct higher-or-lower call doubles the prize, from 10 up to 1000 at the top of the ladder; a single wrong call loses it. Live odds computed from the cards remaining in the deck help you decide when to bank, and one card swap per round can rescue you from a dreaded middle card.
game.objective=Bank as many points as possible over ten rounds.
game.controls=2/Up:Guess higher|8/Down:Guess lower|5:Bank the prize / next round|#:Swap the current card (once per round)|*:Pause menu
