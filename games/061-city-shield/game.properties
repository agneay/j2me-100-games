game.summary=Aim a crosshair and launch interceptors to protect six cities from falling, splitting warheads.
game.description=Missile defence for the keypad. Glide the crosshair with the direction keys (or diagonally with 1/3/7/9) and press 5: the nearest of three bases with ammo fires an interceptor that bursts exactly where you aimed. Blasts chain through anything that flies into them, later waves bring splitting warheads and faster descents, and every wave pays a bonus for surviving cities and unspent ammo.
game.objective=Survive as many waves as possible without losing all six cities.
game.controls=2/4/6/8:Move crosshair|1/3/7/9:Move diagonally|5:Fire interceptor|*:Pause menu
