game.description=The keypad classic, rebuilt from scratch. Every apple makes the snake longer and a little faster, and every fifth apple spawns a fading gold star worth a big bonus. Choose Classic (deadly walls), Wrap (walls wrap around) or Maze (inner walls) on the title screen. Turns are buffered so quick double-taps are never lost.
game.objective=Eat as many apples as possible without hitting yourself (or a wall in Classic and Maze modes).
