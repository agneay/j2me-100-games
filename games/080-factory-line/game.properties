game.summary=Run a sorting line: open the right chute with keys 1-3 as each coloured part rolls past.
game.description=A frantic factory sim. Red, green and blue parts (and grey scrap) ride a conveyor past three chutes leading to colour-coded bins. Keys 1, 2 and 3 toggle the chute gates; a part over an open gate drops straight in, and scrap must ride to the end of the belt. Correct sorts build a combo, wrong bins earn strikes, and the belt keeps getting faster.
game.objective=Sort as many parts as possible before making three mistakes.
game.controls=1:Toggle red chute|2:Toggle green chute|3:Toggle blue chute|*:Pause menu
