game.summary=Grab every gold bar on a screen of ladders, ropes and bricks while guards chase you - dig holes to trap them.
game.description=A single-screen action puzzle platformer. Run, climb ladders and hang from ropes to collect the gold; dig through the brick floor beside you with 1 and 3 to trap pursuing guards, but get clear before the hole fills back in. Taking the last bar raises an escape ladder to the next level. Levels come from a generator that always joins every floor with a ladder, and more guards join as you progress.
game.objective=Collect all the gold on each level and escape up the ladder that appears.
game.controls=4/6:Run|2/8:Climb up / down, drop|1:Dig hole to the left|3:Dig hole to the right|*:Pause menu
