game.summary=Climb five girders by ladder while barrels roll down at you - jump them for points.
game.description=A single-screen climbing platformer. Barrels are thrown from the top, roll along each girder, drop off its open end and occasionally tumble straight down a ladder - including the one you're on. Walk, hop and climb your way to the top girder; every barrel you leap scores 100 and each stage the barrels roll faster and more often. Ladder positions change every stage.
game.objective=Reach the top girder on every stage without getting hit.
game.controls=4/6:Walk|2/8:Climb up / down ladders|5:Jump|*:Pause menu
