game.summary=A pocket roguelike: explore ten generated dungeon floors, level up, and slay the dragon at the bottom.
game.description=Every floor is a fresh set of rooms and corridors revealed by line-of-sight field of view. Movement is turn-based, so take your time: bump into monsters to fight them, gather potions, gold, weapons and armour, and level up as you descend past rats, goblins, skeletons, orcs, trolls and wraiths. Press # for a map of everything you have explored.
game.objective=Reach floor 10 and defeat the dragon.
game.controls=2/4/6/8:Move / attack|1/3/7/9:Move diagonally|5:Wait / take stairs|0:Drink potion|#:Dungeon map|*:Pause menu
