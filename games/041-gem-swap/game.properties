game.summary=Swap neighbouring gems to line up three or more, setting off cascading chain reactions.
game.description=A match-three puzzle with six differently shaped gems, so colours stay readable even on washed-out screens. Gems animate as they swap and fall, cascades multiply your score, invalid swaps bounce back, a hint glows if you hesitate and the board reshuffles itself when no moves remain. Play 30 Moves for strategy or 90 Seconds for speed.
game.objective=Score as many points as possible within 30 moves or 90 seconds.
game.controls=2/4/6/8:Move cursor|5:Pick a gem|2/4/6/8 (after 5):Swap in that direction|0:Cancel|*:Pause menu
game.modes=30 Moves|90 Seconds
