game.summary=A light-and-sound memory game played on the keypad itself: repeat ever-longer sequences of tones.
game.description=The screen mirrors the phone's 3x3 number pad, so every light corresponds to a real key under your thumb. Each round the phone plays one more note, faster than before; repeat it exactly. Classic mode uses the four cross keys, Keypad mode all nine, and Reverse mode makes you play the tune backwards. Fully playable without sound thanks to the lights.
game.objective=Repeat the longest sequence you can.
game.controls=1-9:Play the matching pad|Joystick:Pads 2/4/6/8 and 5|*:Pause menu
game.modes=Classic|Keypad 9|Reverse
game.tags=memory,music,keypad,reflex
game.featured=false
