game.description=The purest one-button arcade challenge. Your helicopter climbs while you hold the key and sinks when you let go; the cave meanders, slowly closes in and starts sprouting rock pillars as you fly deeper, while the scroll speed creeps up. Distance is your score and your best flight is saved.
game.objective=Fly as far as possible without touching the cave or the rock pillars.
