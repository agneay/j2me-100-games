game.description=Old-school first-person dungeon exploration rendered with nothing but filled triangles: corridors, side openings and dead ends recede into the gloom four squares deep. Each floor is a freshly carved maze with loops. Collect the three glowing rune stones to unlock the stairs, bump-fight the green slimes that block the corridors, and check the auto-map of everywhere you have seen with #.
game.objective=Collect three runes and take the stairs on each of three floors.
