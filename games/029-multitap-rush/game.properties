game.summary=Type falling words with old-school multi-tap texting (press 2 three times for C) before they hit the ground.
game.description=A typing game that only makes sense on a phone keypad. Words rain down and you spell them with the letters printed on the number keys. Smart mode accepts each letter the instant you reach it on the key, so it is a pure speed test; Classic mode is authentic multi-tap where you pause or switch keys to confirm, and mistakes break your combo. Longer words unlock as you go.
game.objective=Type as many words as possible before three of them reach the ground.
game.controls=2-9:Multi-tap letters (2 ABC ... 9 WXYZ)|0/#:Confirm letter (Classic mode)|*:Pause menu
game.modes=Smart tap|Classic multitap
game.tags=typing,multitap,texting,words
game.featured=true
