game.description=The classic shedding card game. Match the top card's suit or rank, play an eight at any time to name a new suit, and draw when you're stuck. CPU opponents keep the suits they hold most, save their eights for emergencies and warn you when they're down to their last card. Winning scores the points left in the other players' hands (eights are worth 50).
