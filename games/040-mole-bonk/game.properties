game.summary=Nine molehills laid out like your keypad: press 1-9 to bonk moles, but never the bunnies.
game.description=A reflex game that turns the phone's number pad into the playing field - each hole sits exactly where its key is under your thumb. Moles rise and duck back down faster as time goes on, golden moles pay five times as much, bunnies cost you points and your combo, and a run of hits multiplies your score. Play a 60-second Classic round or Endless, where three escapes end the game.
game.objective=Score as many points as possible by bonking moles (Classic: in 60 seconds; Endless: until three escape).
game.controls=1-9:Bonk the matching hole|Joystick + select:Move cursor and bonk|*:Pause menu
game.modes=Classic 60s|Endless
