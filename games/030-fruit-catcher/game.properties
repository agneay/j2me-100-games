game.summary=Slide your basket to catch falling fruit, chain combos and dodge the bombs.
game.description=A quick-fire catch game with pixel-art fruit. Apples, bananas, grapes and melons are worth more the rarer they are, golden stars are worth 100, and catching in a row builds a multiplier. Magnets widen the basket, clocks slow time, and bombs cost one of your three hearts. Drop ten pieces of fruit and it's over. The pace rises every 20 seconds.
game.objective=Score as many points as possible without catching three bombs or dropping ten fruits.
game.controls=4/Left:Move basket left|6/Right:Move basket right|*:Pause menu
