game.summary=Drill deep for coal, gold and diamonds, sell your haul at the surface and upgrade your pod to reach the core.
game.description=A mining sim with a little pod and a lot of dirt. Drill sideways and down, fly back up on thrusters, and manage fuel, hull and cargo space as ore gets richer with depth: coal, iron, silver, gold, ruby and diamond. Sell at the surface shop, refuel, repair and upgrade your drill, fuel tank, cargo bay and hull. Undiggable rock, gas pockets, lava and long falls stand between you and the ancient core 600 metres down.
game.objective=Reach and drill into the ancient core at the bottom of the mine.
game.controls=4/6:Drive / drill sideways|8:Drill down|2:Fly up|5:Open shop (at the surface)|0/#:Leave shop|*:Pause menu
