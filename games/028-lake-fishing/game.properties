game.summary=Cast from the dock, strike at the bite and play the fish on a tension meter. Six species, one golden rarity.
game.description=A relaxed one-button fishing sim. Cast distance decides depth, and depth decides what bites: minnows in the shallows, bass and pike further out, catfish in the deep and a very rare golden carp anywhere. Strike too early and you spook the fish; reel too hard and the line snaps; let it go slack and the fish throws the hook. The sky turns to sunset over a four-minute day, and your record catch is saved.
game.objective=Score as many points as possible in a four-minute day (or ten casts).
game.controls=5:Swing / cast / strike|5 (hold):Reel in|*:Pause menu
game.modes=Day trip (4 min)|Ten casts
game.tags=fishing,simulation,timing,relaxing
game.featured=false
