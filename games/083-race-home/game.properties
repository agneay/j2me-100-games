game.summary=A cross-and-circle dice race: roll a six to leave base, race round the board and knock rivals back home.
game.description=The family dice race in pocket form. Each player has three tokens; a six brings one out of base and earns another roll, tokens race once round the 28-square track and then up their own home lane, and landing exactly on a rival sends it back to base - except on the starred safe squares. Play one or three CPU opponents who capture greedily, play safe when they can and always bring new tokens out on a six.
game.objective=Be first to get all three of your tokens home.
game.controls=5:Roll / move the selected token|4/6:Choose token|*:Pause menu
