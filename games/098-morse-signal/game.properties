game.summary=Turn the 5 key into a telegraph key: tap out words in Morse code or read a flashing signal lamp against the clock.
game.description=A playful Morse code trainer built around the phone keypad. In Send mode the 5 key becomes a telegraph key - a quick tap is a dot, a longer press is a dash, and a short pause ends the letter. Key whole words letter by letter while the code for each letter is shown, and build combos for clean sending. In Receive mode a lamp flashes and beeps a letter; pick the right one from four choices with keys 1-4, answering before the signal ends for a bonus. Each round lasts 90 seconds.
game.objective=Score as many points as possible in 90 seconds.
game.controls=5:Telegraph key (tap = dot, hold = dash)|1-4:Choose letter (Receive)|0:Replay signal (Receive)|*:Pause menu
game.modes=Send|Receive
game.tags=morse code,timing,education,keypad
game.featured=false
