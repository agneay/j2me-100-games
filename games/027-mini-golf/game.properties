game.summary=Nine top-down crazy-golf holes with bank shots, bumpers, sand traps and water hazards.
game.description=Aim with 4/6 (fine-tune with 1/3), stop the swinging power meter with 5 and watch the ball carom around the course. Walls bounce, bumpers kick the ball back harder, sand drags it to a crawl and water costs a penalty stroke. Hit the cup too hard and the ball skips straight over it. Par 29 for the nine holes; your best round is saved.
game.objective=Complete all nine holes in as few strokes as possible.
game.controls=4/6:Aim (hold)|1/3:Fine aim|5:Start / stop power meter|*:Pause menu
