game.summary=A pseudo-3D motorbike race down a winding, rolling highway against the clock.
game.description=Classic sprite-scaler racing rendered with nothing but triangles and integer maths: a 600-segment road with eased curves and hills, alternating rumble strips, roadside trees and posts, and slower traffic to weave through. Curves push you outward, grass slows you down, collisions send you sliding, and each checkpoint adds time. Two tracks: the gentle Coast road and the steep, twisty Mountain pass.
game.objective=Ride as far as possible, reaching each checkpoint before the timer hits zero.
game.controls=2/5:Throttle|8:Brake|4/6:Steer|*:Pause menu
game.modes=Coast road|Mountain pass
game.tags=racing,pseudo 3d,motorbike,time attack
game.featured=true
