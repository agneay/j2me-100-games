game.summary=The sliding tile puzzle: put the numbers back in order by sliding tiles into the gap.
game.description=The pocket puzzle that predates phones, in three sizes: the quick 3x3 Eight, the classic 4x4 Fifteen and the brain-melting 5x5 Twenty-four. Shuffles are generated from legal moves, so every board is solvable. Tiles slide smoothly, rows are colour-coded and tiles already in their home square glow. Your lowest move count for each size is saved.
game.objective=Restore the tiles to numerical order in as few moves as possible.
game.controls=2/Up:Slide tile up|8/Down:Slide tile down|4/Left:Slide tile left|6/Right:Slide tile right|*:Pause menu
