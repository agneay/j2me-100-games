game.summary=Aim, bank off the walls and pop groups of three matching bubbles before the ceiling pushes down.
game.description=A classic aim-and-fire bubble popper built for the keypad. Sweep the launcher with 4 and 6, fire with 5 and swap with the next bubble using 0. Match three or more of a colour to pop them, and cut loose any bubbles hanging below for a bigger bonus. Every few missed shots the ceiling pushes down a new row; let the cluster reach the dashed line and it is over. Relaxed mode uses four colours and a slower ceiling.
game.objective=Clear every bubble from the board.
game.controls=4/6:Aim launcher|5:Fire|0:Swap with next bubble|*:Pause menu
game.modes=Relaxed|Classic
