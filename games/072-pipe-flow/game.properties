game.summary=Rotate pipe tiles to connect the water inlet to the drain - every grid is generated around a guaranteed solution.
game.description=A plumbing puzzle where each tile is a straight, bend, junction or cross. The generator lays a random self-avoiding route from inlet to drain, fills the rest with decoy pipes and spins every tile, so each board is solvable but never the same. Water spreads live through connected pipes as you rotate, so you can see your progress. Fifteen levels on a 5x5 or 7x7 grid; fewer turns score more.
game.objective=Connect the inlet on the left to the drain on the right on every level.
game.controls=2/4/6/8:Move cursor|5:Rotate clockwise|0:Rotate anticlockwise|*:Pause menu
game.modes=5x5|7x7
game.tags=puzzle,pipes,rotation,logic
game.featured=false
