game.summary=Gladiator duels: read high and low wind-ups, block to stun, punish the opening, and upgrade between six bouts.
game.description=Timing-based arena combat. Each opponent telegraphs attacks high or low; block to match and they are stunned for a double-damage counter. Quick strikes are safe, heavy strikes hit three times harder and interrupt wind-ups but drain stamina. Later gladiators wind up faster and feint. After every win pick an upgrade: strength, armour, stamina or vitality.
game.objective=Defeat all six gladiators to become Arena Champion.
