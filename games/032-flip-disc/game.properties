game.summary=Outflank and flip your opponent's discs on an 8x8 board - against a positional CPU or a friend.
game.description=The classic disc-flipping strategy game. Legal moves are dotted, flips animate, the last move is marked and passes are announced automatically. The CPU combines a positional weight table (corners good, squares next to corners bad) with mobility in an alpha-beta search one, two or three plies deep. Your best disc count against the CPU is saved.
game.objective=Have more discs of your colour than your opponent when neither side can move.
game.controls=2/4/6/8:Move cursor|1/3/7/9:Move diagonally|5:Place disc|*:Pause menu
game.modes=vs CPU Easy|vs CPU Normal|vs CPU Hard|2 Players
