game.summary=The classic patience game: build four suits from Ace to King, with Draw 1 and Draw 3 rules.
game.description=Full Klondike solitaire designed for a joystick or the 2/4/6/8 keys. A single cursor walks the stock, waste, foundations and seven columns; pressing 2 inside a column grows the selection to pick up a whole run. Press # to fling a card to its foundation, and once every card is face-up the game finishes itself automatically. Long columns compress to fit even a 128-pixel screen.
game.objective=Move all 52 cards onto the four foundations.
game.controls=4/6:Move cursor|2/8:Change row / grow or shrink run selection|5:Pick up / drop / turn stock|#:Send card to foundation|0:Cancel pick-up|*:Pause menu
game.modes=Draw 1|Draw 3
game.tags=solitaire,patience,cards,classic
game.featured=true
