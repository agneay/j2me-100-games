game.summary=Explore six flip-screen caverns, climb ladders, collect five crystals and find the key to escape.
game.description=A compact flip-screen exploration platformer in the style of 8-bit cave games. Walk off a screen edge to reach the next cavern, climb ladders between levels, dodge swooping bats and floor spikes, and gather the five crystals. An iron door guards the exit and only opens for the key. Your fastest escape time is saved.
game.objective=Collect all five crystals and the key, open the door and reach the exit as fast as you can.
