game.summary=Zone homes, shops and factories, lay roads and power, and grow a town of 2000 citizens in ten years.
game.description=A pocket city builder on a 12x12 map with a winding river. Zones grow on their own when they touch a road and sit within reach of a power plant; residents need jobs, jobs need residents, parks help neighbourhoods and factories next to homes hold them back. Monthly taxes pay for road and power upkeep, bridges cost extra, and the goal is 2000 citizens within ten years. Sandbox mode has unlimited money.
game.objective=Reach a population of 2000 within ten years without going bankrupt.
game.controls=2/4/6/8:Move cursor|5:Build with the current tool|0/#:Next tool|1:Previous tool|*:Pause menu
