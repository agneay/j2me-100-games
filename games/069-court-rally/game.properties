game.summary=Top-down tennis against the CPU: time your swing to aim, rally, and win a three-game set.
game.description=A compact tennis game seen from above. Slide along the baseline and press 5 as the ball arrives; swing early to pull the shot one way, late to push it the other, or press 2 for a lob. Balls are judged in or out on the first bounce, a second bounce loses the point, and full tennis scoring with deuce and advantage is used. Pro mode speeds up the ball and sharpens the CPU.
game.objective=Win three games before the CPU does.
