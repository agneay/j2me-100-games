game.summary=Raise a monster partner and battle through eight trainers with turn-based, element-driven combat.
game.description=Pick Emberpup, Ripplefin or Thornbud and take on a gauntlet of eight trainers ending with the Champion. Six original species and six elements interact through a strengths-and-weaknesses chart, speed decides who strikes first, Guard halves incoming damage, and at level 8 your partner learns a devastating special move with limited uses. Experience, levelling and potions carry you through.
game.objective=Defeat all eight trainers, including the Champion.
