game.summary=Dots and boxes: draw lines, complete boxes to claim them, and avoid handing your opponent a chain.
game.description=The pencil-and-paper classic on a 4x4 or 5x5 board. The cursor glides between the lines of the grid, completed boxes are stamped with their owner and the last line drawn is highlighted. The standard CPU grabs free boxes and avoids giving away third sides; the Smart CPU also simulates how many boxes each forced move would hand you and picks the cheapest. Two players can share the phone too.
game.objective=Claim more boxes than your opponent.
game.controls=2/4/6/8:Move between lines|5:Draw line|*:Pause menu
