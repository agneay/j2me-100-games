game.summary=Plant a handful of seeds and let them grow by cellular-automaton rules; score the plants that end up on golden soil.
game.description=A gardening puzzle built on a classic cellular automaton. Each generation, an empty plot with exactly three living neighbours sprouts, and a plant with two or three neighbours survives while the rest wither. In Challenge mode you get a limited number of seeds and a set number of generations; plan a pattern that blooms across the golden fertile plots and holds there when the growing stops. Five gardens per game. Sandbox mode gives unlimited seeds with run, pause and single-step controls for free experimenting.
game.objective=Have as many plants as possible on golden plots when the final generation ends.
game.controls=2/4/6/8:Move cursor|5:Plant / remove seed|0:Grow (Sandbox: run / pause)|1:Single step (Sandbox)|#:Clear (Sandbox)|*:Pause menu
game.modes=Challenge|Sandbox
