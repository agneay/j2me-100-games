game.summary=A football penalty shoot-out where the goal is mapped onto your keypad: press 1-9 to place your shot or pick your dive.
game.description=Five kicks each, then sudden death. When shooting, choose one of nine target zones with the matching number key and stop the power meter in the green - blast it and it may sail over the bar, scuff it and the keeper reaches it easily. When saving, watch the run-up and press a number to dive. Keepers get sharper at Pro and Legend level.
game.objective=Score more penalties than the CPU in the shoot-out.
game.controls=1-9:Aim shot / choose dive zone|2/4/6/8:Move aim (joystick)|5:Confirm aim / stop power bar|*:Pause menu
game.modes=Amateur|Pro|Legend
game.tags=football,soccer,penalties,keypad
game.featured=true
