game.summary=Peg solitaire on three boards: jump pegs over each other until only one remains, with unlimited undo.
game.description=The old wooden-board puzzle in your pocket. Pick up a peg with 5, then press a direction to jump it over a neighbour into an empty hole, removing the peg you jumped. Play the classic 33-hole cross, a smaller diamond, or a 15-hole triangle where diagonal jumps along the slope are allowed. Press 0 to undo as far back as you like. Fewer pegs left is better; a single peg in the centre of the cross is the master finish.
game.objective=Leave as few pegs on the board as possible, ideally just one.
game.controls=2/4/6/8:Move cursor / jump direction|5:Pick up or drop peg|1/9:Diagonal jump (Triangle)|0:Undo|*:Pause menu
game.modes=Cross|Diamond|Triangle
