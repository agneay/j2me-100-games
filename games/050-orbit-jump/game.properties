game.summary=A one-button space hop: break orbit at the right moment to be captured by the next planet up.
game.description=Your ship circles each planet automatically - your only control is when to let go. Launch along the tangent of your orbit, sail across the gap and get caught by the next planet's gravity field (shown as a faint ring). Stars beside each planet are worth bonus points, later planets spin faster and drift sideways, and missing everything costs one of three ships.
game.objective=Hop as far up the planet chain as you can.
game.controls=5:Launch from orbit|*:Pause menu
