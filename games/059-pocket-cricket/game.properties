game.summary=Chase down a target in a two-over, super-over or five-over run chase - pick the shot and nail the timing.
game.description=A batting game built around reading the delivery. Each ball has a line (leg, middle, off), a length (yorker, full, good, short) and a pace; play to the leg side with 4, the off side with 6, loft it straight with 2 or block with 8, timed to the moment the ball arrives. Perfect timing finds the boundary, short balls sit up to be hit, yorkers are hard to score from, lofted shots risk a catch and leaving a straight ball can cost your stumps.
game.objective=Score the target runs before you run out of balls or wickets.
game.controls=4:Leg-side shot|6:Off-side shot|2:Lofted drive|8:Defensive block|5:Next ball|*:Pause menu
game.modes=2-over chase|Super over|5-over chase
game.tags=cricket,sports,timing,batting
game.featured=true
