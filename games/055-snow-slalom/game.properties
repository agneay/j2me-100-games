game.summary=Carve down the mountain through 25 flag gates against the clock - or freeride through the forest.
game.description=A top-down downhill race. Your skis have five angles: pointing straight down is fastest, while wide carves scrub off speed but get you across the slope. Tuck for extra speed, snowplough to slow down, and thread every red and blue gate; each one you miss costs five seconds, and trees and rocks send you tumbling. Giant slalom has wide gates, Slalom tight ones, and Freeride is an endless forest run.
game.objective=Pass through every gate and reach the finish line in the fastest time (Freeride: ski as far as you can).
game.controls=4/6:Turn skis|8:Tuck (faster)|2:Snowplough (slower)|*:Pause menu
