game.summary=Wall-jump your way up an endless shaft, timing each kick to dodge spikes while the screen keeps rising.
game.description=A one-button vertical climber. You cling to a wall and slowly slide down it; press 5 to kick off and leap diagonally up to the opposite wall. Spike strips line both walls, gems sparkle in risky spots, and the camera climbs on its own - faster the higher you get - so hesitating is as deadly as jumping into spikes.
game.objective=Climb as high as possible without hitting spikes or falling behind the rising screen.
game.controls=5/2:Wall jump|*:Pause menu
