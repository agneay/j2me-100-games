game.summary=English draughts with forced captures, multi-jumps and kings, against a three-level CPU.
game.description=Full rules of English checkers: men move diagonally forward, captures are mandatory, multi-jump sequences must be completed and men reaching the far row are crowned. The CPU runs an alpha-beta search that follows jump chains to the end, two, four or six plies deep. Legal destinations are marked, the last move is highlighted and the status line reminds you when a capture is forced. Your record is saved.
game.objective=Capture or block all of the CPU's pieces.
game.controls=2/4/6/8:Move cursor|1/3/7/9:Move diagonally|5:Select piece / move|0:Cancel selection|*:Pause menu
