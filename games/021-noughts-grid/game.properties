game.summary=Noughts and crosses where the keypad is the board - plus a 5x5 four-in-a-row variant.
game.description=On the classic board, keys 1-9 map one-to-one onto the squares, so playing feels like pressing the grid itself. The Perfect CPU uses full minimax and never loses; Easy makes human mistakes. The 5x5 board needs four in a row and has a heuristic CPU, and both boards support two players on one phone.
game.objective=Get three (or four on 5x5) of your marks in a row.
game.controls=1-9:Play that square (3x3)|2/4/6/8:Move cursor|5:Play at cursor|*:Pause menu
game.modes=3x3 vs CPU Easy|3x3 vs CPU Perfect|3x3 2 Players|5x5 vs CPU|5x5 2 Players
