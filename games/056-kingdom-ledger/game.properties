game.summary=Rule a small kingdom for ten years by deciding how much land to trade, grain to feed and acres to sow.
game.description=A resource-management classic in the spirit of the earliest computer strategy games, rebuilt for a keypad. Each year set three numbers - land to buy or sell, grain to feed your people and acres to sow - then read the royal report of harvests, rat raids, starvation, newcomers and the occasional plague. Starve too many in one year and you are overthrown; survive ten years and you are judged on land per person and lives lost.
game.objective=Survive ten years with a growing, well-fed population and plenty of land per person.
game.controls=2/8:Choose decision|4/6:Change by 1 (land) or 10 (grain)|1/3:Change by 10x|5 or #:End the year / continue|*:Pause menu
