game.summary=Drop discs into a seven-column grid and line up four before your opponent - against the CPU or a friend.
game.description=The vertical four-in-a-row game built for the keypad: press 1-7 to drop straight into a column, or steer with the joystick. The CPU uses alpha-beta search with a window-scoring evaluation at depth 2, 4 or 6, and a hot-seat mode lets two people share one phone. The starting player alternates every game and your record against the CPU is saved.
game.objective=Connect four of your discs in a row - horizontally, vertically or diagonally.
game.controls=1-7:Drop disc in that column|Joystick left/right:Move cursor|Select:Drop at cursor|*:Pause menu
