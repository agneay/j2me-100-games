game.summary=Slide numbered tiles around the board and merge equal pairs until you build the target tile.
game.description=The sliding number puzzle where equal tiles combine into their sum. Tiles glide smoothly, merged tiles pulse, and one undo per move rescues a slip of the thumb. Three boards: the classic 4x4 race to 2048, a tight 3x3 to 256 and a roomy 5x5 to 4096.
game.objective=Create a tile with the target number (2048 on 4x4) before the board fills up.
game.controls=2/Up:Slide up|4/Left:Slide left|6/Right:Slide right|8/Down:Slide down|0:Undo last move|*:Pause menu
