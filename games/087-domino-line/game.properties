game.summary=Draw dominoes against the CPU with a double-six set: match the open ends, draw when stuck, go out first.
game.description=A clean game of draw dominoes. The highest double opens, tiles must match one of the line's two open ends, and if you can't play you draw from the boneyard. Press 1 or 3 to choose which end, or 5 to let the game pick the end that fits; playable tiles light up in your hand. The CPU dumps its heaviest tiles first. Going out scores the pips left in your opponent's hand; a blocked game goes to the lighter hand.
game.objective=Play all your dominoes before the CPU does.
game.controls=4/6:Choose tile|1:Play on left end|3:Play on right end|5:Play on any fitting end|#:Draw / pass|*:Pause menu
