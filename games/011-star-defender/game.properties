game.summary=Defend the planet from a marching alien formation, hiding behind shields that crumble under fire.
game.description=A fixed-shooter with an original cast of pixel aliens. The formation marches faster as it shrinks and drops lower each time it hits a wall, shields erode block by block from both sides, a mystery ship drifts across the top now and then, and every new wave starts a little closer to the ground.
game.objective=Destroy every alien in each wave before the formation reaches the ground. Three lives.
