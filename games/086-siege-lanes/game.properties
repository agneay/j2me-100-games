game.summary=Three lanes, two castles: spend gold to send spearmen, archers and knights up a lane with keys 1-3.
game.description=A real-time lane battle for the keypad. Gold trickles in; pick a troop type and press 1, 2 or 3 to deploy it into the left, middle or right lane. Spearmen are cheap, archers strike from range and knights soak up damage. Troops fight anything they meet and batter the enemy castle if they break through, while the CPU reinforces whichever lane you are pushing hardest.
game.objective=Destroy the enemy castle before your own falls.
game.controls=4/6:Choose troop type|1/2/3:Deploy to left / middle / right lane|*:Pause menu
game.modes=Squire|Warlord
