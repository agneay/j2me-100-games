game.summary=A top-down rally time trial: steer a free-rotating car through numbered checkpoints over two laps.
game.description=Rally driving viewed from above on a scrolling 40x40 stage. The car rotates smoothly through 256 headings with speed-sensitive steering; dirt road is fast, grass and water slow you down and trees stop you dead. An on-screen arrow always points to the next checkpoint. Two stages - Forest and Lakeside - each with a saved best time.
game.objective=Pass every checkpoint in order and complete two laps in the fastest time.
