game.summary=A 60-second basketball shoot-out: time the aim and power, bank it off the glass, and catch fire.
game.description=Side-on basketball with real projectile physics. Stop the swinging aim arrow, then the power meter, and the ball arcs toward the hoop where it can rattle off the front or back of the rim, kiss the backboard or drop clean through. Shots from beyond the arc are worth three, the shooting spot moves after every basket, and three in a row sets you on fire for double points.
game.objective=Score as many points as possible in 60 seconds.
