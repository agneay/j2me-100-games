game.description=Complete chess rules - castling, en passant, promotion, check, checkmate, stalemate, the 50-move rule and insufficient material - with an integer-only alpha-beta search tuned for handset CPUs. Easy looks one move ahead with some randomness, Normal searches two plies plus captures, Hard searches three plies plus captures. Legal moves are highlighted, and your win/loss/draw record is saved on the phone.
game.objective=Checkmate the computer's king.
