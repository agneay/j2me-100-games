game.summary=Stock the shelves, set your prices and read the weather to turn $50 into a fortune in 30 days.
game.description=A pocket shop-keeping sim. Each morning check the forecast, buy six kinds of stock at wholesale and set selling prices; then open the doors and watch customers walk in. Hot days sell ice cream, rain sells umbrellas, overpricing drives people away, empty shelves cost reputation, and bread, milk and ice cream spoil if left on the shelf. A daily report shows sales, costs and spoilage.
game.objective=Finish 30 days with as much cash as possible ($200 counts as a win, $500 is excellent).
game.controls=2/8:Choose item|4/6:Change buy quantity or price|#:Switch buy / price column|5:Open the shop / continue|5 (hold):Fast-forward the day|*:Pause menu
