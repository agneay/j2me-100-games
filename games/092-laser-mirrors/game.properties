game.summary=Rotate mirrors to bounce a laser beam through every crystal; fifteen generated puzzles with walls, decoys and bolted mirrors.
game.description=A laser fires in from the left wall of a 7x7 board. Move the cursor onto a mirror and press 5 to flip it between its two diagonals, steering the beam until it passes through every target crystal. Later puzzles add stone blocks that stop the beam, decoy mirrors and mirrors bolted in place. Each puzzle is built from a real beam path, so a solution always exists; fewer rotations earn more points.
game.objective=Light every crystal in all fifteen puzzles.
game.controls=2/4/6/8:Move cursor|5:Rotate mirror|0:Reset puzzle|*:Pause menu
