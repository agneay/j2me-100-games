game.summary=The ancient take-away game: remove sticks from one row per turn - take the last (or avoid it in misere).
game.description=Rows of matchsticks, two players, one rule: take any number of sticks from a single row. Normal play rewards taking the final stick; misere play punishes it. The standard CPU blunders now and then, while the Expert CPU plays the mathematically perfect nim-sum strategy - you can still win, but only from a winning position and without a single slip. Boards are the classic 1-3-5-7 or randomly dealt.
game.objective=Normal: take the last stick. Misere: force the CPU to take it.
game.controls=2/8:Choose row|4/6:Choose how many|5:Take sticks|*:Pause menu
game.modes=Normal vs CPU|Misere vs CPU|Normal vs Expert|Misere vs Expert
