game.summary=Quarter-mile drag races won on launch revs and perfectly timed gear shifts, with a garage full of upgrades.
game.description=A timing-based racer built around a tachometer. Rev the engine during the countdown to nail the launch, then shift up through five gears when the needle hits the green band - too early bogs the engine, too late bounces off the limiter. Beat five rivals of rising skill, and spend your prize money on engine, gearbox and tyre upgrades between races.
game.objective=Beat all five rivals to become drag strip champion.
game.controls=5 (hold):Rev during the countdown|5/6:Shift up|2/8:Choose upgrade (garage)|5:Buy upgrade (garage)|#:Start the race|*:Pause menu
