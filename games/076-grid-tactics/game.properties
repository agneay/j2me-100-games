game.summary=Turn-based squad battles on an 8x8 field: move, attack, use cover and outmanoeuvre the red army.
game.description=A pocket tactics game. Your four units - Soldiers, an Archer and a Knight - each move and attack once per turn; movement ranges are highlighted, archers shoot from three squares away, units in trees take reduced damage and rocks block the way. The enemy AI weighs every reachable square to focus down your weakest unit. Win three battles against growing armies on randomly generated fields.
game.objective=Defeat the enemy army in three consecutive battles.
game.controls=2/4/6/8:Move cursor|5:Select unit / destination / target|0:Cancel or skip attack|#:End your turn|*:Pause menu
