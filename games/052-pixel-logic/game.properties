game.summary=Picture-logic puzzles: use the number clues on every row and column to reveal hidden pixel art.
game.description=Fourteen original picture-logic puzzles - six 5x5 warm-ups and eight 10x10 pictures. Clues list the runs of filled cells in each line; fill cells with 5 and mark known blanks with 0. Clues grey out as their line becomes correct, the cursor's row and column clues are highlighted, and any grid that satisfies every clue counts as solved, so you are never punished for an alternative solution. Progress is saved.
game.objective=Fill the grid so every row and column matches its clues.
game.controls=2/4/6/8:Move cursor|5:Fill / clear cell|0/#:Mark cell as empty|*:Pause menu
game.modes=5x5 puzzles|10x10 puzzles
