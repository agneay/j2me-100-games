game.summary=An endless vertical jumper: bounce from platform to platform, steering left and right, and climb as high as you can.
game.description=Your hopper bounces on its own; you only steer. Platforms are spawned within jumping range, then mix in sliding, crumbling, one-use cloud and spring platforms as you climb. The sky darkens into a starfield the higher you go, screen edges wrap around, and stars on platforms give bonus points.
game.objective=Climb as high as possible without falling off the bottom of the screen.
game.controls=4/Left:Steer left|6/Right:Steer right|*:Pause menu
