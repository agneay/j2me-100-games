game.summary=A one-button runner that cannot jump - flip gravity to fall between floor and ceiling past holes and spikes.
game.description=You sprint along an endless corridor where the only move is reversing gravity. Tap to fall to the ceiling, tap again to drop back to the floor, dodging holes and spike strips on both surfaces. The generator never blocks both surfaces at once, so every death is a timing mistake, and the pace never stops increasing.
game.objective=Run as far as possible without falling out of the corridor or hitting spikes.
game.controls=5/2/8:Flip gravity|*:Pause menu
