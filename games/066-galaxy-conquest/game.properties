game.summary=Real-time space strategy: send fleets between planets to out-produce and overwhelm the red empire.
game.description=Planets of different sizes build ships at different rates. Jump the cursor between planets with the direction keys, pick a planet you own and a target, and half its ships launch. Fleets that land on enemy or neutral worlds battle the defenders and capture the planet if they outnumber them. The CPU picks targets by value and distance, and on Admiral it also reinforces its weak worlds. Every map is freshly generated.
game.objective=Capture every red planet and destroy every red fleet.
game.controls=2/4/6/8:Jump to the nearest planet in that direction|5:Choose source planet, then target|0:Cancel|*:Pause menu
