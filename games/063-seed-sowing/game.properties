game.summary=A count-and-capture mancala-family game: sow seeds round the board, earn free turns and capture across.
game.description=One of the world's oldest kinds of board game, played with the classic store-and-capture rules. Press 1-6 to sow one of your pits and watch the seeds drop one at a time; landing in your store earns another turn and landing in an empty pit of your own captures the pit opposite. The CPU plans ahead with an alpha-beta search that understands free turns, or play a friend on one phone.
game.objective=Finish with more seeds in your store than your opponent.
game.controls=1-6:Sow that pit|4/6:Choose pit|5:Sow chosen pit|*:Pause menu
