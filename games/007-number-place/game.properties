game.summary=Fill the 9x9 grid so every row, column and box holds 1-9. Fresh puzzles generated on the phone, always with exactly one solution.
game.description=A number-placement logic puzzle with an on-device generator: a valid grid is shuffled, then clues are removed one at a time while a bitmask backtracking solver proves the solution stays unique. Two input styles cover every handset: Keypad mode (2/4/6/8 move, 5 opens a number picker) for phones without a joystick, and Direct mode (# toggles) where digits write straight into the cell. Clashes are highlighted and matching digits glow.
game.objective=Complete the grid correctly in the shortest time.
game.controls=2/4/6/8:Move cursor (keypad mode)|5:Open number picker|1-9:Write digit (direct mode / picker)|0:Clear cell|#:Toggle keypad / direct mode|*:Pause menu
game.modes=Easy|Medium|Hard
game.tags=logic,sudoku-style,numbers,time trial
game.featured=true
