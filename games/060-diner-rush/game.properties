game.summary=Run a busy diner single-handed: the room is laid out like your keypad, so key 1-6 sends your waiter to that table.
game.description=A time-management restaurant game designed around the number pad. Tables sit where keys 1-6 are and the kitchen hatch where key 8 is, so serving becomes muscle memory. Take orders when guests raise a hand, drop them at the kitchen, carry up to two plates back, serve before patience bars run out, and clear tables for the next guests. Quick service earns bigger tips, every fifth meal in a row earns a streak bonus and three walk-outs end your shift.
game.objective=Earn as much money as possible in a three-minute shift without three guests walking out.
game.controls=1-6:Walk to that table|8/0:Walk to the kitchen|*:Pause menu
