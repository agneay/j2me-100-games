game.summary=One-on-one beach volleyball: run, jump and head the ball over the net, with three touches a side.
game.description=A sunny side-on volleyball match between two round beach players. Run with 4 and 6 and jump with 2 or 5; where the ball strikes your head decides its angle, so get under it to pop it up and jump into it to drive it over the net. You get at most three touches before the ball must cross. The CPU reads the ball's flight and leaps for blocks, more often on Hard.
game.objective=Win the match by reaching seven points first.
