game.summary=Top-down three-lap circuit races against three AI drivers on two Grand Prix tracks.
game.description=Wheel-to-wheel racing from above. Start from a grid, slipstream your way through the pack, brake for the tight corners and keep off the grass. AI rivals follow the racing line and ease off for bends, cars bump and slow each other in close combat, and the HUD shows your live position. Oval GP is fast and flowing; Twisty GP tests your braking.
game.objective=Finish the three-lap race in first place.
