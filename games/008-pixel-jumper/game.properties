game.description=A side-scrolling platformer with variable-height jumps, coyote time and jump buffering so the keypad feels responsive. Levels come from a seeded generator that only builds gaps and ledges within jumping range, so all eight stages are the same every time you play and always beatable. Collect 100 coins for an extra life.
game.objective=Reach the flag at the end of all eight levels.
