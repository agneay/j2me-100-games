game.summary=Five in a row on an 11x11 board, against a CPU that weighs every open three and four.
game.description=The ancient five-in-a-row stone game. Place black stones on the intersections and be first to an unbroken line of five. The CPU scores every candidate point for both attack and defence using open-ended run patterns, so it will block your open threes and pounce on your mistakes; Easy is more forgiving. A two-player mode lets friends share the phone. The winning line is drawn and the last stone is marked.
game.objective=Be the first to place five stones in an unbroken line.
game.controls=2/4/6/8:Move cursor|1/3/7/9:Move diagonally|5:Place stone|*:Pause menu
