game.summary=Vertical table tennis against a CPU opponent that predicts your shots. First to 7 wins.
game.description=A portrait-friendly take on paddle tennis built for tall handset screens. Where the ball meets your paddle sets the return angle, every rally speeds the ball up, and the CPU predicts wall bounces with a deliberate margin of error that shrinks on harder settings.
game.objective=Score 7 points before the CPU does by getting the ball past its paddle at the top of the table.
