game.summary=Deduce a hidden code of coloured pegs from black and white feedback markers.
game.description=The classic code-cracking deduction game. Each colour sits on its own number key, so entering a guess is just a few taps; the cursor advances automatically and # submits. After every guess you see how many pegs are the right colour in the right place (black) and the right colour in the wrong place (white). Play the standard 4 pegs / 6 colours in 10 guesses, or the tougher 5 pegs / 8 colours in 12.
game.objective=Crack the hidden code in as few guesses as possible.
game.controls=1-8:Set the current peg's colour|#/0:Submit guess|Joystick:Move / cycle colours / submit|*:Pause menu
game.modes=4 pegs, 6 colours|5 pegs, 8 colours
game.tags=logic,deduction,colours,puzzle
game.featured=false
