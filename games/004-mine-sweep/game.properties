game.summary=Deduce where the mines are from the numbers and open every safe square.
game.description=The logic classic for a keypad: move with 2/4/6/8 (or diagonally with 1/3/7/9), open with 5 and flag with 0 or #. The first square is always safe, opened numbers can be chorded, and boards larger than the screen scroll with the cursor so even the 16x16 field works on a 128x128 display.
game.objective=Open every square that does not contain a mine, as fast as you can.
game.controls=2/4/6/8:Move cursor|1/3/7/9:Move diagonally|5:Open square / chord|0/#:Flag|*:Pause menu
game.modes=Easy 8x8|Medium 12x12|Hard 16x16
