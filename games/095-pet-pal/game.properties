game.summary=Hatch an egg and raise a pixel pet to adulthood: feed it, play with it, clean up and tuck it in.
game.description=A pocket virtual pet that grows up in about four minutes. Watch an egg hatch, then keep four needs topped up - food, fun, cleanliness and rest - while your pet grows from baby to child, teen and adult. Neglect costs health, messes make it sick and medicine cures it, but overfeeding and needless medicine do harm. Playtime is a quick left-or-right guessing game. A well cared for pet becomes a special happy adult.
game.objective=Raise your pet to adulthood in good health.
game.controls=4/6:Choose action|5:Do action|4/6 in play:Guess left / right|*:Pause menu
