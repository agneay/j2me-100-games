game.summary=Rapid-fire mental arithmetic typed straight on the number pad, checked the instant you enter the last digit.
game.description=The number pad was made for this. Sums, differences, products and divisions appear one after another and you type the answer directly; there is no confirm key, because the answer is checked the moment you have typed enough digits. Sprint mode gives you 60 seconds, with every correct answer adding a second. Survival puts a shrinking timer on each question and gives you three lives. Streaks raise the difficulty and mistakes ease it back down.
game.objective=Solve as many problems as possible before time or lives run out.
game.controls=0-9:Type answer|#:Clear typed digits|*:Pause menu
game.modes=Sprint|Survival
game.tags=maths,arithmetic,education,keypad
game.featured=false
