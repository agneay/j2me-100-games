game.summary=Pick a colour to flood your territory into matching neighbours - out-grow the CPU to own the board.
game.description=A two-player territory game on an 11x11 board of six colours. You expand from the bottom-left, the CPU from the top-right; each turn you choose a colour (never your own or your opponent's) and absorb every touching tile of it. Press 1-6 to pick instantly. The clever CPU weighs not only its own gain but also which colours would most help you next turn.
game.objective=Own more than half of the board.
