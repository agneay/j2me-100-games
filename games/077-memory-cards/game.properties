game.summary=Turn over cards two at a time and find all the matching pairs - solo or in a duel against a forgetful CPU.
game.description=The classic pairs memory game played with a deck of cards. Solo modes on a 4x4 or 5x6 layout reward finishing in the fewest turns. In Duel mode you and the CPU alternate, a match earns another go, and the CPU remembers only some of the cards it has seen - so it is beatable, but it will pounce on any pair it knows.
game.objective=Find every matching pair (solo: in the fewest turns; duel: more pairs than the CPU).
game.controls=2/4/6/8:Move cursor|5:Turn over card|*:Pause menu
