game.summary=A tiny console-style RPG: roam the overworld, fight random battles, shop in towns and defeat the Dark Knight.
game.description=A complete pocket role-playing adventure. Walk a scrolling overworld of plains, forests, rivers and mountains where monsters grow tougher the further you roam. Battles are turn-based with Attack, Magic (heal or fire), Potions and Run. Two towns offer an inn and a shop for potions and weapon and armour upgrades, a cave hides the Hero Sword behind three fights in a row, and the Dark Knight waits in the castle to the north-east.
game.objective=Grow strong enough to defeat the Dark Knight in his castle.
game.controls=2/4/6/8:Walk / choose option|5:Confirm|*:Pause menu
