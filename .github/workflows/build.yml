name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, validate, package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: tools/lib
          key: toolchain-${{ hashFiles('tools/bootstrap.py') }}

      - name: Bootstrap toolchain (pinned, SHA-256 checked)
        run: python tools/bootstrap.py --no-teavm

      - name: Build all games (JAR + JAD)
        run: tools/build-all.sh --jobs 4

      - name: Validate repository
        run: python tools/validate.py

      - name: Package release files
        run: tools/ant.sh -f build.xml -Dskip.dist=true package

      - name: Upload JAR/JAD files
        uses: actions/upload-artifact@v4
        with:
          name: j2me-100-games
          path: |
            release/games/
            release/*.zip
          if-no-files-found: error

  test:
    name: Test games ${{ matrix.prefix }}x
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        prefix: ["00", "01", "02", "03", "04", "05", "06", "07", "08", "09", "10"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: tools/lib
          key: toolchain-${{ hashFiles('tools/bootstrap.py') }}

      - name: Bootstrap toolchain
        run: python tools/bootstrap.py --no-teavm

      - name: Build games ${{ matrix.prefix }}x
        run: |
          tools/ant.sh -q -f build.xml tools
          python tools/build_all.py --jobs 4 ${{ matrix.prefix }}

      - name: Reference-runtime tests (5 resolutions)
        run: python tools/run_tests.py --jobs 4 ${{ matrix.prefix }}

      - name: MicroEmulator smoke tests
        run: python tools/microemu_check.py --jobs 2 ${{ matrix.prefix }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.prefix }}
          path: reports/
