name: Build

on:
  push:
    branches: [main]
    tags: ["v*", "game-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: tools/lib
          key: toolchain-${{ hashFiles('tools/bootstrap.py') }}

      - name: Bootstrap toolchain (pinned, SHA-256 checked)
        run: python tools/bootstrap.py --no-teavm

      - name: Build all games (JAR + JAD)
        run: tools/build-all.sh --jobs 4

      - name: Reference-runtime tests (5 resolutions)
        run: python tools/run_tests.py --jobs 4

      - name: MicroEmulator smoke tests
        run: python tools/microemu_check.py --jobs 4

      - name: Validate repository
        run: python tools/validate.py

      - name: Package release files
        run: tools/ant.sh -f build.xml -Dskip.dist=true package

      - name: Upload JAR/JAD files
        uses: actions/upload-artifact@v4
        with:
          name: j2me-100-games
          path: |
            release/games/
            release/*.zip
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
