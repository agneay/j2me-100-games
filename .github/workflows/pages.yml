name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: tools/lib
          key: toolchain-full-${{ hashFiles('tools/bootstrap.py') }}

      - name: Bootstrap toolchain including TeaVM
        run: python tools/bootstrap.py

      - name: Build all games
        run: tools/build-all.sh --jobs 4

      - name: Build browser demos (TeaVM)
        run: python tools/build_all.py --target web --jobs 4

      - name: Generate site
        run: |
          python tools/gen_docs.py --no-media
          python tools/gen_site.py

      - name: Check links
        run: python tools/check_links.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
